<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner Chat Starter</title>
<script src="https://media.twiliocdn.com/sdk/js/conversations/v2.7/twilio-conversations.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    width: min(100%, 460px);
    height: min(90vh, 700px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: white;
    border-radius: 18px;
  }
  header {
    padding: 18px;
    color: white;
    background: #120a45;
  }
  #identity {
    padding: 12px 18px;
    border-bottom: 1px solid #e5e7eb;
  }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
    background: #f9fafb;
  }
  #composer {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid #e5e7eb;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 10px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
  }
  button {
    width: 44px;
  }
  #connect-button {
    width: auto;
    margin-top: 8px;
    padding: 8px 12px;
  }
  .message {
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff;
  }
  .user {
    background: #667eea;
    color: white;
    margin-left: 48px;
  }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>Trip Planner</h1>
    <p id="status">Connecting...</p>
  </header>

  <section id="identity">
    <label>
      Phone identity
      <input id="identity-input" type="tel" value="+447700900123" placeholder="+447700900123">
    </label>
    <button id="connect-button" type="button">Connect</button>
  </section>

  <section id="messages"></section>

  <section id="composer">
    <textarea id="message-input" rows="1" placeholder="Ask about your trip..."></textarea>
    <button id="send-button" disabled>Send</button>
  </section>
</main>

<script>
const AGENT_IDENTITY = 'ai-agent';

let client = null;
let conversation = null;
let currentIdentity = null;

const statusEl = document.getElementById('status');
const identityInput = document.getElementById('identity-input');
const connectButton = document.getElementById('connect-button');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('message-input');
const sendButton = document.getElementById('send-button');

function addMessage(text, type = 'agent') {
  const el = document.createElement('div');
  el.className = `message ${type}`;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function connect(identity) {
  if (!identity) {
    statusEl.textContent = 'Enter a phone identity';
    return;
  }

  statusEl.textContent = 'Connecting...';
  sendButton.disabled = true;

  // TODO: Fetch a token from /token.
  const tokenResponse = await fetch('/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ identity })
  });
  const { token } = await tokenResponse.json();

  // TODO: Create the Twilio Conversations client.
  client = await Twilio.Conversations.Client.create(token);
  currentIdentity = identity;

  // TODO: Get or create a conversation for this identity.
  conversation = await client.createConversation({
    uniqueName: `trip-planner-${identity}-${Date.now()}`,
    friendlyName: `Trip Planner - ${identity}`
  });
  await conversation.join();

  conversation.on('messageAdded', (message) => {
    if (message.author === AGENT_IDENTITY) {
      addMessage(message.body);
    }
  });

  statusEl.textContent = `Connected as ${identity}`;
  sendButton.disabled = false;
}

sendButton.addEventListener('click', async () => {
  const text = inputEl.value.trim();
  if (!text || !conversation) return;

  addMessage(text, 'user');
  inputEl.value = '';

  // TODO: Send the message through Twilio Conversations.
  await conversation.sendMessage(text);
});

connectButton.addEventListener('click', () => {
  connect(identityInput.value.trim()).catch((error) => {
    console.error(error);
    statusEl.textContent = 'Connection failed';
  });
});

connect(identityInput.value.trim()).catch((error) => {
  console.error(error);
  statusEl.textContent = 'Connection failed';
});
</script>
</body>
</html>
