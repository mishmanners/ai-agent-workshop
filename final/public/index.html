<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner Chat</title>
<script src="https://media.twiliocdn.com/sdk/js/conversations/v2.7/twilio-conversations.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    margin: 0;
  }

  #app {
    width: min(100%, 480px);
    height: min(90vh, 720px);
    background: #fff;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    box-shadow: 0 24px 70px rgba(17, 24, 39, 0.32);
    overflow: hidden;
  }

  #header {
    background: linear-gradient(135deg, #06033A 0%, #1e1550 100%);
    color: #fff;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  #header-icon {
    font-size: 28px;
  }

  #header-content {
    flex: 1;
  }

  #header h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  #header p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.72);
  }

  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.82);
    background: rgba(255, 255, 255, 0.12);
    padding: 6px 12px;
    border-radius: 999px;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    transition: background 0.3s;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  #status-dot.connected {
    background: #22c55e;
    animation: none;
  }

  #status-dot.error {
    background: #ef4444;
    animation: none;
  }

  #identity-selector {
    background: #f9fafb;
    padding: 14px 20px;
    border-bottom: 1px solid #e5e7eb;
    flex-shrink: 0;
  }

  #identity-selector label {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
    display: block;
  }

  #identity-controls {
    display: flex;
    gap: 8px;
  }

  #identity-input {
    flex: 1;
    min-width: 0;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    color: #1f2937;
    background: white;
    transition: border-color 0.2s;
  }

  #identity-input:hover {
    border-color: #9ca3af;
  }

  #identity-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.14);
  }

  #connect-identity {
    padding: 0 14px;
    border: 0;
    border-radius: 6px;
    background: #667eea;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  #messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #f9fafb;
  }

  #messages::-webkit-scrollbar {
    width: 6px;
  }

  #messages::-webkit-scrollbar-track {
    background: transparent;
  }

  #messages::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 3px;
  }

  #messages::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg-row.user {
    justify-content: flex-end;
  }

  .msg-row.ai {
    justify-content: flex-start;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .msg-row.user .avatar {
    background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
  }

  .msg-content {
    max-width: 70%;
    display: flex;
    flex-direction: column;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg-row.user .msg-bubble {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-row.ai .msg-bubble {
    background: #fff;
    color: #1f2937;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 12px rgba(17, 24, 39, 0.08);
  }

  .msg-time {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 4px;
    padding: 0 4px;
  }

  .msg-row.user .msg-time {
    text-align: right;
  }

  #input-area {
    padding: 12px 20px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 2;
  }

  #input-container {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  #message-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    color: #1f2937;
    background: #f9fafb;
    transition: all 0.2s;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }

  #message-input:focus {
    outline: none;
    background: #fff;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.14);
  }

  #message-input::placeholder {
    color: #9ca3af;
  }

  #send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  #send-btn:hover:not(:disabled) {
    transform: scale(1.04);
    box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
  }

  #send-btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .system-message {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    padding: 8px;
    margin: 8px 0;
    background: rgba(102, 126, 234, 0.08);
    border-radius: 8px;
  }

  .welcome-message {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.11) 0%, rgba(118, 75, 162, 0.11) 100%);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
  }

  .welcome-message h2 {
    font-size: 18px;
    color: #06033A;
    margin-bottom: 8px;
  }

  .welcome-message p {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div id="header-icon">✈️</div>
    <div id="header-content">
      <h1>Trip Planner</h1>
      <p>Your AI travel assistant</p>
    </div>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <div id="identity-selector">
    <label for="identity-input">Phone number identity:</label>
    <div id="identity-controls">
      <input id="identity-input" type="tel" value="+447700900123" placeholder="+447700900123" />
      <button id="connect-identity" type="button">Connect</button>
    </div>
  </div>

  <div id="messages">
    <div class="welcome-message">
      <h2>Welcome to Trip Planner</h2>
      <p>
        I'm your AI travel assistant. I can help you plan trips, remember your preferences,
        and give personalized recommendations. Try asking about destinations, hotels,
        restaurants, or activities!
      </p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-container">
      <textarea
        id="message-input"
        placeholder="Ask me about your next trip..."
        rows="1"
      ></textarea>
      <button id="send-btn" disabled>➤</button>
    </div>
  </div>
</div>

<script>
let conversationsClient = null;
let activeConversation = null;
let currentIdentity = null;

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const messagesDiv = document.getElementById('messages');
const messageInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const identityInput = document.getElementById('identity-input');
const connectIdentityBtn = document.getElementById('connect-identity');

// Auto-resize textarea
messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Handle Enter key (send), Shift+Enter (new line)
messageInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

connectIdentityBtn.addEventListener('click', async function() {
  const identity = identityInput.value.trim();
  await connectAsIdentity(identity);
});

async function connectAsIdentity(identity) {
  try {
    if (!identity) {
      throw new Error('Phone number identity is required');
    }

    setStatus('connecting', 'Connecting...');

    // Get access token from server
    const tokenResponse = await fetch('/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity })
    });

    if (!tokenResponse.ok) {
      throw new Error('Failed to get access token');
    }

    const { token } = await tokenResponse.json();

    // Initialize Conversations client
    conversationsClient = await Twilio.Conversations.Client.create(token);
    currentIdentity = identity;

    // Handle token expiration
    conversationsClient.on('tokenAboutToExpire', async () => {
      const newTokenResponse = await fetch('/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: currentIdentity })
      });
      const { token: newToken } = await newTokenResponse.json();
      conversationsClient.updateToken(newToken);
    });

    // Try to get or create conversation
    await getOrCreateConversation(identity);

    setStatus('connected', 'Connected');
    sendBtn.disabled = false;

  } catch (error) {
    console.error('Connection error:', error);
    setStatus('error', 'Connection failed');
    addSystemMessage('Failed to connect. Please refresh and try again.');
  }
}

async function getOrCreateConversation(identity) {
  try {
    // List user's conversations
    const conversations = await conversationsClient.getSubscribedConversations();

    // Find existing trip planner conversation
    let conversation = conversations.items.find(c =>
      c.friendlyName && c.friendlyName.includes('trip-planner')
    );

    if (!conversation) {
      // Create new conversation
      const uniqueName = `trip-planner-${identity}-${Date.now()}`;
      conversation = await conversationsClient.createConversation({
        uniqueName,
        friendlyName: `Trip Planner - ${identity}`
      });

      // Join the conversation
      await conversation.join();

      addSystemMessage('New conversation started');
    } else {
      addSystemMessage('Conversation resumed');
    }

    activeConversation = conversation;

    // Load previous messages
    const messages = await conversation.getMessages();
    messages.items.forEach(msg => {
      if (msg.author !== 'ai-agent') {
        addMessage(msg.body, 'user', msg.dateCreated);
      } else {
        addMessage(msg.body, 'ai', msg.dateCreated);
      }
    });

    // Listen for new messages
    conversation.on('messageAdded', (message) => {
      if (message.author === 'ai-agent') {
        addMessage(message.body, 'ai', message.dateCreated);
      }
    });

  } catch (error) {
    console.error('Conversation error:', error);
    throw error;
  }
}

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !activeConversation) return;

  // Add user message to UI
  addMessage(text, 'user');

  // Send message via Conversations SDK
  try {
    await activeConversation.sendMessage(text);
    messageInput.value = '';
    messageInput.style.height = 'auto';
  } catch (error) {
    console.error('Send error:', error);
    addSystemMessage('Failed to send message. Please try again.');
  }
}

function addMessage(text, type, timestamp = new Date()) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = type === 'user' ? 'You' : '🤖';

  const content = document.createElement('div');
  content.className = 'msg-content';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(timestamp);

  content.appendChild(bubble);
  content.appendChild(time);

  if (type === 'ai') {
    row.appendChild(avatar);
  }
  row.appendChild(content);
  if (type === 'user') {
    row.appendChild(avatar);
  }

  messagesDiv.appendChild(row);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addSystemMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'system-message';
  msg.textContent = text;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function setStatus(state, text) {
  statusDot.className = state;
  statusText.textContent = text;
}

function formatTime(date) {
  if (!(date instanceof Date)) {
    date = new Date(date);
  }
  return date.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}

// Auto-connect on load
window.addEventListener('load', () => {
  const defaultIdentity = identityInput.value.trim();
  connectAsIdentity(defaultIdentity);
});
</script>

</body>
</html>
